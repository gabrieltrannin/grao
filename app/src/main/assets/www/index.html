<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Grão</title>
<style>
:root{--bg:#0d0f14;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--ink:#eef0f4;--mute:#9aa1ad;--acc:#ff8a1f;--mono:"Roboto Mono",monospace}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit}
.app{height:100%;display:flex;flex-direction:column;background:radial-gradient(120% 45% at 50% 0%,#1b2030 0%,var(--bg) 70%)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px}
.ib{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);display:grid;place-items:center;padding:0}
.ib svg{width:20px;height:20px}
.ib.on{background:var(--acc);color:#1a0f05;border-color:var(--acc)}
.pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);overflow:hidden}
.pill i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.pill b{flex:none;font:700 15px var(--mono);color:var(--acc);white-space:nowrap}
.pill span{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{display:flex;gap:8px}
.finder{position:relative;flex:1 1 auto;margin:0 16px;border-radius:22px;padding:8px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:padding .25s}
#view{max-width:100%;max-height:100%;border-radius:14px;background:#000;touch-action:none;display:block}
/* visor reduzido: a prévia vira a janelinha de uma câmera compacta */
.finder.mini{padding:28px 48px 40px;background:linear-gradient(180deg,#2a2d35,#17191f 60%,#101114);box-shadow:inset 0 2px 0 rgba(255,255,255,.08),inset 0 -6px 18px rgba(0,0,0,.6)}
.finder.mini #view{border-radius:6px;box-shadow:0 0 0 6px #08090b,0 0 0 7px rgba(255,255,255,.12)}
.finder .lensmark{position:absolute;right:16px;top:12px;font:700 13px var(--mono);color:var(--acc);display:none}
.finder .brand{position:absolute;left:18px;top:10px;font:700 12px var(--mono);color:#cfd3db;letter-spacing:.08em;display:none}
.finder.mini .lensmark,.finder.mini .brand{display:block}
.msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--mute);font-size:15px}
.count{position:absolute;inset:0;display:grid;place-items:center;font:700 96px var(--mono);color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.6);pointer-events:none}
.half{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.6);font:700 13px var(--mono);color:var(--acc);pointer-events:none}
.flash{position:absolute;inset:8px;border-radius:14px;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:fl .45s ease-out}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
.ctl{display:flex;gap:8px;padding:12px 16px 0;align-items:center}
.chip{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:600 14px var(--mono);display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip.sel{border-color:var(--acc);color:var(--acc)}
.chip svg{width:16px;height:16px}
.roll{display:flex;gap:10px;overflow-x:auto;padding:12px 16px 6px;scrollbar-width:none;flex:none}
.roll::-webkit-scrollbar{display:none}
.film{flex:none;width:84px;padding:9px 4px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--ink);text-align:center}
.film.sel{border-color:var(--acc);background:rgba(255,138,31,.14)}
.sw{display:block;width:38px;height:38px;margin:0 auto 6px;border-radius:50%;box-shadow:inset 0 -6px 10px rgba(0,0,0,.35)}
.film b{display:block;font-size:13px;font-weight:600;white-space:nowrap}
.film small{display:block;font:600 11px var(--mono);color:var(--acc)}
.bar{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 30px 18px}
.thumb{width:54px;height:54px;border-radius:14px;border:2px solid var(--ink);background:#222 center/cover;padding:0;display:grid;place-items:center;color:var(--ink)}
.thumb svg{width:22px;height:22px}
.shutter{width:82px;height:82px;border-radius:50%;border:4px solid var(--ink);background:transparent;display:grid;place-items:center;padding:0;justify-self:center}
.shutter span{width:64px;height:64px;border-radius:50%;background:var(--ink);transition:transform .1s}
.shutter:active span{transform:scale(.88)}
.shutter.save span{background:var(--acc);display:grid;place-items:center;color:#1a0f05}
.right{justify-self:end}.left{justify-self:start}
/* painel de controles (lente, luz, cor, receitas) */
.pop{position:fixed;left:0;right:0;bottom:0;max-height:78%;overflow-y:auto;background:#151922;border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:8px 16px 24px;transform:translateY(105%);transition:transform .25s ease;z-index:5}
.pop.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:rgba(255,255,255,.2);margin:4px auto 10px}
.pop h3{margin:14px 0 8px;font-size:13px;color:var(--mute);font-weight:600;display:flex;justify-content:space-between}
.pop h3 output{font:700 14px var(--mono);color:var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.rec{flex:none;width:132px;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--ink);text-align:left}
.rec b{display:block;font-size:13px}
.rec small{display:block;font:600 11px var(--mono);color:var(--mute);margin-top:3px}
.rec.sel{border-color:var(--acc)}
.wb{position:relative;height:104px;border-radius:14px;touch-action:none;
  background:linear-gradient(to bottom,rgba(255,110,210,.55),rgba(255,255,255,0) 50%,rgba(70,230,140,.6)),linear-gradient(to right,#8f7cff,#78c8ff 30%,#f4f1ea 48%,#ffd27a 70%,#ff7448)}
.wb::before,.wb::after{content:"";position:absolute;background:rgba(0,0,0,.35)}
.wb::before{left:44%;top:0;bottom:0;border-left:1px dashed rgba(0,0,0,.45);background:none}
.wb::after{top:50%;left:0;right:0;border-top:1px dashed rgba(0,0,0,.45);background:none}
.knob{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#111;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none}
.row{display:grid;grid-template-columns:7.2em minmax(0,1fr) 2.8em;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid rgba(255,255,255,.07)}
.row output{font:600 14px var(--mono);color:var(--acc);text-align:right}
input[type=range]{width:100%;height:40px;accent-color:var(--acc);margin:0}
.sw2{width:52px;height:32px;border-radius:999px;border:0;padding:3px;background:rgba(255,255,255,.18);display:flex;justify-self:end;grid-column:2/4}
.sw2 i{width:26px;height:26px;border-radius:50%;background:#fff}
.sw2.on{background:var(--acc);justify-content:flex-end}
.frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.frames button{padding:10px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:13px;font-weight:600}
.frames button.sel{border-color:var(--acc)}
.frames span{display:block;height:54px;border-radius:5px;margin-bottom:8px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:var(--mute);font-size:13px}
.foot button,.btn{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#1d2230;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:88vw;text-align:center}
.toast.on{opacity:1}
.hide{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="ib" id="bTorch" aria-label="Flash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg></button>
    <button class="ib hide" id="bBack" aria-label="Voltar para a câmera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="pill"><i></i><b id="tag">LUME R</b><span id="sub">26mm</span></div>
    <div class="tr">
      <button class="ib" id="bMini" aria-label="Visor reduzido"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><rect x="6" y="9" width="7" height="5" rx="1"/><circle cx="17" cy="12" r="1.6"/><path d="M6 6V4.5h4V6"/></svg></button>
      <button class="ib" id="bTimer" aria-label="Temporizador de 3 segundos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg></button>
    </div>
  </div>

  <div class="finder" id="finder">
    <span class="brand" id="brand">LUME R</span><span class="lensmark" id="lensmark">26mm</span>
    <canvas id="view"></canvas>
    <div class="msg" id="msg">Abrindo a câmera…</div>
    <div class="half hide" id="halfTag">1/2</div>
    <div class="count hide" id="count"></div>
    <div class="flash" id="flash"></div>
  </div>

  <div class="ctl">
    <button class="chip" id="cLens">26</button>
    <button class="chip" id="cEv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span id="evv">0</span></button>
    <button class="chip" id="cWb">5600K 0</button>
    <button class="chip" id="cRec" style="margin-left:auto">Receitas</button>
  </div>

  <div class="roll" id="roll"></div>

  <div class="bar">
    <button class="thumb left" id="bGal" aria-label="Abrir da galeria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></button>
    <button class="shutter" id="bShot" aria-label="Tirar foto"><span></span></button>
    <button class="ib right" id="bFlip" aria-label="Virar câmera" style="width:54px;height:54px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M4 4v4h4M20 20v-4h-4"/></svg></button>
    <button class="ib right hide" id="bEdit" aria-label="Mais ajustes" style="width:54px;height:54px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
</div>

<div class="pop" id="pop">
  <div class="grab"></div>
  <div id="pRec">
    <h3>Receitas</h3>
    <div class="chips" id="recs"></div>
  </div>
  <div id="pLens">
    <h3>Lente <output id="oLens">26mm</output></h3>
    <div class="chips" id="lenses"></div>
  </div>
  <h3>Exposição <output id="oEv">0</output></h3>
  <input id="ev" type="range" min="-3" max="3" step="0.1" value="0">
  <h3>Balanço de branco <output id="oWb">5600K 0</output></h3>
  <div class="wb" id="wb"><div class="knob" id="knob"></div></div>
  <div style="display:flex;justify-content:space-between;margin-top:6px;color:var(--mute);font-size:12px"><span>mais frio</span><span>↑ magenta · verde ↓</span><span>mais quente</span></div>
  <div id="pMore">
    <h3>Ajustes</h3>
    <div class="row"><label for="amt">Intensidade</label><input id="amt" type="range" min="0" max="100" value="100"><output id="oamt">100</output></div>
    <div class="row"><label for="grn">Grão</label><input id="grn" type="range" min="0" max="200" value="100"><output id="ogrn">100</output></div>
    <div class="row"><label for="lk">Luz vazada</label><input id="lk" type="range" min="0" max="200" value="100"><output id="olk">100</output></div>
    <div class="row"><span>Data na foto</span><button class="sw2" id="bDate" aria-label="Data na foto"><i></i></button></div>
    <h3>Moldura</h3>
    <div class="frames" id="frames"></div>
  </div>
  <div class="foot"><button class="btn" id="bAuto">Voltar ao padrão</button><button id="bUpd">Procurar atualização</button></div>
  <div class="foot" style="margin-top:8px"><span id="ver">Grão</span></div>
</div>

<input type="file" accept="image/*" id="pick" class="hide">
<div class="toast" id="toast"></div>

<script>
{
const $=s=>document.querySelector(s);
const AND=window.Android||null;
// ---------- câmeras (looks) ----------
// ex exposição base · con curva em S · sat saturação · warm amarelado · tnt verde(+)/magenta(-) · gdes tira saturação do verde
// cross mar/céu para verde-água · roll luzes suaves · sh/hi cor das sombras/luzes · bp preto lavado · wp branco máximo
// soft maciez · hal brilho em volta das luzes · vig cantos · grain grão · leak luz vazada · half meio-quadro
// padrão: K temperatura, tg tint, lens lente
const FILMS=[
 {n:'Lume R',d:'digital com cor de filme',sw:['#f2e7cf','#7aa6a0','#1d3a40'],ex:0,con:.45,sat:.72,warm:.15,tnt:.06,gdes:.35,cross:.25,roll:.45,sh:[-.01,.012,0],hi:[.012,0,-.02],bp:.03,wp:.93,soft:.04,hal:.08,vig:.18,grain:.22,ca:.05,leak:0,lc:[1,.5,.2],K:6200,tg:-5,lens:26,date:0,frame:'none'},
 {n:'Grava R',d:'contraste e sombra funda',sw:['#e8d9bd','#8a7a5c','#141414'],ex:-.15,con:.65,sat:.62,warm:.3,tnt:0,gdes:.4,cross:.1,roll:.3,sh:[.01,0,-.01],hi:[.02,0,-.03],bp:.015,wp:.95,soft:.03,hal:.1,vig:.25,grain:.3,ca:.05,leak:0,lc:[1,.5,.2],K:6500,tg:0,lens:28,date:0,frame:'none'},
 {n:'Sessenta 7',d:'quente e encorpado',sw:['#ffcf8a','#c0602a','#3a1c10'],ex:0,con:.6,sat:1.05,warm:.45,tnt:-.03,gdes:.1,cross:.15,roll:.3,sh:[.03,-.005,-.03],hi:[.04,0,-.05],bp:.02,wp:.94,soft:.08,hal:.15,vig:.2,grain:.15,ca:.03,leak:0,lc:[1,.5,.2],K:6800,tg:0,lens:50,date:0,frame:'none'},
 {n:'NT 16',d:'sol dourado e verde oliva',sw:['#f3dc9a','#9a9a5a','#3a3420'],ex:.05,con:.4,sat:.75,warm:.45,tnt:.1,gdes:.2,cross:.2,roll:.4,sh:[.02,.01,-.02],hi:[.04,.02,-.05],bp:.04,wp:.93,soft:.12,hal:.15,vig:.25,grain:.3,ca:.1,leak:0,lc:[1,.5,.2],K:7000,tg:-5,lens:35,date:0,frame:'none'},
 {n:'Compacta 35',d:'dourada de câmera de bolso',sw:['#ffd77a','#e08a3a','#1f4a50'],ex:0,con:.6,sat:.9,warm:.55,tnt:.02,gdes:.1,cross:.35,roll:.35,sh:[-.02,.01,.02],hi:[.05,.02,-.06],bp:.05,wp:.95,soft:.15,hal:.25,vig:.3,grain:.35,ca:.2,leak:.15,lc:[1,.5,.15],K:6000,tg:0,lens:35,date:1,frame:'none'},
 {n:'Meio Quadro',d:'duas fotos lado a lado',sw:['#dfe3cf','#6f8a6a','#1f2a22'],ex:0,con:.4,sat:.6,warm:.05,tnt:.12,gdes:.15,cross:.3,roll:.4,sh:[-.02,.02,0],hi:[0,.01,-.01],bp:.05,wp:.92,soft:.2,hal:.15,vig:.3,grain:.5,ca:.15,leak:0,lc:[1,.5,.2],K:5600,tg:0,lens:28,date:0,frame:'none',half:1},
 {n:'Vencida',d:'filme vencido e desbotado',sw:['#d9cf9a','#7a7448','#2a2a1a'],ex:-.35,con:.35,sat:.55,warm:.4,tnt:.15,gdes:0,cross:.1,roll:.3,sh:[.03,.02,-.03],hi:[.02,.02,-.03],bp:.14,wp:.9,soft:.35,hal:.25,vig:.45,grain:.85,ca:.25,leak:.35,lc:[1,.4,.2],K:6000,tg:0,lens:35,date:1,frame:'none'},
 {n:'Noite Âmbar',d:'luzes quentes, preto fundo',sw:['#ffc070','#b03a1a','#0a0806'],ex:-.1,con:.7,sat:1,warm:.5,tnt:-.03,gdes:.1,cross:0,roll:.35,sh:[.01,0,-.01],hi:[.06,0,-.08],bp:.01,wp:.95,soft:.1,hal:.45,vig:.3,grain:.35,ca:.05,leak:0,lc:[1,.5,.2],K:5500,tg:-8,lens:26,date:0,frame:'none'}
];
const FI=n=>FILMS.findIndex(f=>f.n===n);
// receitas tiradas das referências: câmera + temperatura + tint + exposição + lente
const RECS=[
 ['Pôr do sol na praia','Grava R',7410,2,-2,26],
 ['Praia clara','Lume R',5386,-10,.6,26],
 ['Praia azul','Lume R',5386,-10,-.9,26],
 ['Mar e céu','Lume R',8308,-15,0,26],
 ['Verão no Rio','Lume R',6200,-1,0,26],
 ['Penhasco','Lume R',6587,-9,-3,30],
 ['Cidade dourada','Lume R',7500,31,-1,35],
 ['Quarto verde','Lume R',9800,-32,0,26],
 ['Café escuro','Grava R',8300,9,-1,24],
 ['Festa à noite','Noite Âmbar',9031,-5,-3,26],
 ['Luzes de Natal','Noite Âmbar',5500,-8,0,26],
 ['Madeira quente','Sessenta 7',8600,0,0,50],
 ['Sol na janela','NT 16',8200,0,0,35],
 ['Fim de tarde','Compacta 35',6500,0,0,35],
 ['Meio quadro','Meio Quadro',5600,0,0,28],
 ['Filme vencido','Vencida',6000,0,0,35]
];
const LENSES=[24,26,28,30,35,45,50];
const S={f:0,amt:1,grn:1,lk:1,date:0,frame:'none',K:6200,tg:-5,ev:0,lens:26,rec:-1,
  seed:1,lp:[.95,.1],hold:false,live:true,facing:'environment',torch:false,timer:false,mini:false,
  src:null,stream:null,half1:null};

// ---------- WebGL ----------
const gc=document.createElement('canvas');
const gl=gc.getContext('webgl',{premultipliedAlpha:false,preserveDrawingBuffer:true});
const VS='attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0,1);}';
const FS=`precision highp float;varying vec2 v;uniform sampler2D t;uniform vec2 res,lp,cs;
uniform float ex,con,sat,warm,tnt,gdes,cross,roll,bp,wp,soft,hal,vig,grain,ca,leak,seed,amt,mir,wbt,wbg;
uniform vec3 sh,hi,lc;
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233))+seed)*43758.5453);}
vec3 tx(vec2 u){u=.5+(u-.5)*cs;if(mir>.5)u.x=1.-u.x;return texture2D(t,clamp(u,0.,1.)).rgb;}
float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}
void main(){vec2 uv=v,d=uv-.5;vec2 px=vec2(1./res.x,1./res.y)*max(1.,res.x/1000.);
vec3 o=tx(uv);float a=ca*.004;
vec3 c=vec3(tx(uv+d*a).r,o.g,tx(uv-d*a).b);
if(soft>0.){vec3 bl=(tx(uv+px*vec2(1.5,0.))+tx(uv-px*vec2(1.5,0.))+tx(uv+px*vec2(0.,1.5))+tx(uv-px*vec2(0.,1.5)))*.25;c=mix(c,bl,soft*.8);}
vec3 g=vec3(0.);for(int i=0;i<12;i++){float an=float(i)*.5236;float r=(i<6)?.007:.016;g+=max(tx(uv+vec2(cos(an)*res.y/res.x,sin(an))*r)-.85,0.);}
g/=12.;
c*=exp2(ex);
c*=vec3(1.+.2*wbt,1.-.13*wbg,1.-.28*wbt);
float bd=max(c.b-max(c.r,c.g),0.);float l0=lum(c);c.r-=bd*cross*.7;c.g+=bd*cross*.25*(1.-l0);c.b-=bd*cross*.15*l0;
float wb=1.-clamp(bd*4.,0.,.75);c.r+=warm*.05*wb;c.g+=warm*.022*wb;c.b-=warm*.07*wb;
c.g+=tnt*.035;c.r-=tnt*.012;c.b-=tnt*.012;
float l=lum(c);float gr=clamp((c.g-max(c.r,c.b))*4.,0.,1.);c=mix(c,vec3(l)+(c-vec3(l))*.35,gr*gdes);
c=mix(vec3(l),c,sat*mix(.75,1.,clamp(l,0.,1.)));
c=clamp(c,0.,1.);c=mix(c,c*c*(3.-2.*c),con);
c=c*(1.+roll)/(1.+roll*c);
l=lum(c);c+=sh*(1.-l)*(1.-l)*2.+hi*l*l*2.;
c=bp*vec3(1.,.95,.86)+c*(wp-bp);
c+=vec3(1.,.42,.15)*g*hal*2.2;
vec2 ar=vec2(res.x/res.y,1.);float ld=distance(uv*ar,lp*ar);
c=1.-(1.-clamp(c,0.,1.))*(1.-lc*smoothstep(1.,.0,ld)*leak*.8);
float vg=length(d*vec2(1.,res.y/res.x)*1.15);c*=mix(1.,smoothstep(.95,.2,vg),vig);
float gs=max(1.,res.x/1300.);vec2 fc=gl_FragCoord.xy;
float n=(h(floor(fc/gs))-.5)*.75+(h(floor(fc/(gs*2.2))+3.7)-.5)*.5;
l=clamp(lum(c),0.,1.);c+=n*grain*.15*(1.-l*l*.7);
gl_FragColor=vec4(mix(o,clamp(c,0.,1.),amt),1.);}`;
const mk=(ty,src)=>{const s=gl.createShader(ty);gl.shaderSource(s,src);gl.compileShader(s);return s};
const pr=gl.createProgram();gl.attachShader(pr,mk(gl.VERTEX_SHADER,VS));gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const ap=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,2,gl.FLOAT,false,0,0);
gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());
for(const [k,v] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,k,v);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
const U={};const u=n=>U[n]||(U[n]=gl.getUniformLocation(pr,n));
const upload=src=>gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);

function renderGL(w,h,mir,cs){
  const F=FILMS[S.f];gc.width=w;gc.height=h;gl.viewport(0,0,w,h);
  gl.uniform2f(u('res'),w,h);gl.uniform2f(u('lp'),S.lp[0],S.lp[1]);gl.uniform2f(u('cs'),cs[0],cs[1]);
  for(const k of ['con','sat','warm','tnt','gdes','cross','roll','bp','wp','soft','hal','vig','ca'])gl.uniform1f(u(k),F[k]);
  gl.uniform1f(u('ex'),F.ex+S.ev*.45);
  gl.uniform1f(u('wbt'),Math.max(-1,Math.min(1.5,(S.K-5600)/4000)));gl.uniform1f(u('wbg'),S.tg/50);
  gl.uniform1f(u('grain'),F.grain*S.grn);gl.uniform1f(u('leak'),F.leak*S.lk);
  gl.uniform1f(u('seed'),S.seed);gl.uniform1f(u('amt'),S.hold?0:S.amt);gl.uniform1f(u('mir'),mir?1:0);
  gl.uniform3fv(u('sh'),F.sh);gl.uniform3fv(u('hi'),F.hi);gl.uniform3fv(u('lc'),F.lc);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
// recorte da câmera ao vivo: lente (zoom) e meio-quadro (retrato estreito)
function liveCrop(vw,vh){
  const F=FILMS[S.f],z=S.lens/24,A=vw/vh;let sx=1,sy=1;
  if(F.half){const T=.72;if(A>T)sx=T/A;else sy=A/T}
  return [sx/z,sy/z];
}
// desenha foto + moldura + data em cv; iw/ih = tamanho já recortado
function compose(cv,max,iw,ih,mir,cs){
  const k=Math.min(1,max/Math.max(iw,ih)),w=Math.round(iw*k),h=Math.round(ih*k),F=FILMS[S.f];
  let W=w,H=h,x=0,y=0;
  if(S.frame==='polaroid'){const p=Math.round(w*.06);x=p;y=p;W=w+2*p;H=h+p+Math.round(w*.24)}
  if(S.frame==='film'){const p=Math.round(h*.11),s=Math.round(w*.03);x=s;y=p;W=w+2*s;H=h+2*p}
  if(cv.width!==W)cv.width=W;if(cv.height!==H)cv.height=H;
  const c=cv.getContext('2d');renderGL(w,h,mir,cs);c.clearRect(0,0,W,H);
  if(S.frame==='polaroid'){c.fillStyle='#f3efe6';c.fillRect(0,0,W,H);
    c.fillStyle='#2b2b33';c.font=`italic ${Math.round(w*.06)}px serif`;c.textBaseline='middle';
    c.fillText(F.n.toLowerCase()+' · '+new Date().toLocaleDateString('pt-BR',{month:'short',year:'numeric'}),x+w*.04,y+h+(H-y-h)/2)}
  if(S.frame==='film'){c.fillStyle='#120d0a';c.fillRect(0,0,W,H);
    const hw=w*.035,hh=y*.32;c.fillStyle='#e9e2d6';
    for(let i=0;i*hw*2<W;i++){const px=i*hw*2+hw*.5;c.fillRect(px,y*.22,hw,hh);c.fillRect(px,H-y*.22-hh,hw,hh)}
    c.fillStyle='#e8933a';c.font=`bold ${Math.round(y*.22)}px monospace`;c.textBaseline='middle';
    c.fillText(F.n.toUpperCase()+'  >  '+((S.seed*7|0)%36+1)+'A',x+w*.04,y*.78)}
  c.drawImage(gc,x,y,w,h);
  if(S.date&&!S.hold){const d=new Date(),z=n=>String(n).padStart(2,'0');
    const t=`'${z(d.getFullYear()%100)} ${z(d.getMonth()+1)} ${z(d.getDate())}`,fs=Math.round(Math.min(w,h)*.055);
    c.font=`bold ${fs}px monospace`;c.textAlign='right';c.textBaseline='alphabetic';
    c.shadowColor='rgba(255,110,20,.9)';c.shadowBlur=fs*.4;c.fillStyle='#ff9a2e';
    c.fillText(t,x+w-w*.05,y+h-h*.05);c.shadowBlur=0;c.textAlign='left'}
}

// ---------- câmera ao vivo ----------
const video=document.createElement('video');video.playsInline=true;video.muted=true;
const view=$('#view');
function fit(){
  const f=$('#finder'),cs=getComputedStyle(f);
  const aw=f.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=f.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const r=view.width/view.height||.75;let w=aw,h=aw/r;if(h>ah){h=ah;w=ah*r}
  view.style.width=w+'px';view.style.height=h+'px';
}
async function startCam(){
  stopCam();$('#msg').textContent='Abrindo a câmera…';$('#msg').classList.remove('hide');
  try{
    S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:S.facing,width:{ideal:1920},height:{ideal:1440}},audio:false});
    video.srcObject=S.stream;await video.play();$('#msg').classList.add('hide');
    const tr=S.stream.getVideoTracks()[0],cap=tr.getCapabilities?tr.getCapabilities():{};
    $('#bTorch').style.visibility=cap.torch?'visible':'hidden';S.torch=false;$('#bTorch').classList.remove('on');
  }catch(e){$('#msg').textContent='Não consegui abrir a câmera. Permita o acesso nas configurações do app, ou use a galeria.'}
}
function stopCam(){if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}}
let last=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!S.live||!S.stream||video.readyState<2||t-last<33)return;last=t;
  S.seed=Math.random()*99;upload(video);
  const vw=video.videoWidth,vh=video.videoHeight,cs=liveCrop(vw,vh);
  compose(view,900,vw*cs[0]*S.lens/24,vh*cs[1]*S.lens/24,S.facing==='user',cs);fit();
}
requestAnimationFrame(loop);

// ---------- modo foto ----------
const ONE=[1,1];
function drawPhoto(){if(!S.live&&S.src){upload(S.src);compose(view,1200,S.src.width,S.src.height,false,ONE);fit()}}
let raf=0;const redraw=()=>{if(S.live)return;cancelAnimationFrame(raf);raf=requestAnimationFrame(drawPhoto)};
function setMode(live){
  S.live=live;
  for(const id of ['bTorch','bTimer','bFlip','bMini'])$('#'+id).classList.toggle('hide',!live);
  $('#bBack').classList.toggle('hide',live);$('#bEdit').classList.toggle('hide',live);
  $('#cLens').classList.toggle('hide',!live);$('#pLens').classList.toggle('hide',!live);
  $('#pMore').classList.toggle('hide',live);
  const sb=$('#bShot');sb.classList.toggle('save',!live);sb.setAttribute('aria-label',live?'Tirar foto':'Salvar foto');
  sb.firstElementChild.innerHTML=live?'':'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>';
  if(live){$('#pop').classList.remove('on');S.half1=null;halfTag();if(!S.stream)startCam()}
}
function grab(){ // recorta o quadro atual do vídeo conforme a lente
  const vw=video.videoWidth,vh=video.videoHeight,cs=liveCrop(vw,vh);
  const cw=vw*cs[0],ch=vh*cs[1];
  const k=Math.min(1,3000/Math.max(cw,ch)),c=document.createElement('canvas');
  c.width=Math.round(cw*k);c.height=Math.round(ch*k);const x=c.getContext('2d');
  if(S.facing==='user'){x.translate(c.width,0);x.scale(-1,1)}
  x.drawImage(video,(vw-cw)/2,(vh-ch)/2,cw,ch,0,0,c.width,c.height);
  return c;
}
function capture(){
  if(!S.stream||video.readyState<2)return;
  const c=grab();flash();
  if(FILMS[S.f].half){
    if(!S.half1){S.half1=c;halfTag();toast('Agora a segunda foto');return}
    const a=S.half1,g=Math.round(a.width*.04),out=document.createElement('canvas');
    out.width=a.width+c.width+g;out.height=Math.max(a.height,c.height);
    const x=out.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,out.width,out.height);
    x.drawImage(a,0,0);x.drawImage(c,a.width+g,0);S.half1=null;S.src=out;
  }else S.src=c;
  S.seed=Math.random()*99;setMode(false);drawPhoto();
}
function halfTag(){const on=S.live&&FILMS[S.f].half;$('#halfTag').classList.toggle('hide',!on);$('#halfTag').textContent=S.half1?'2/2':'1/2'}
async function loadFile(file){
  if(!file)return;
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:'from-image'}).catch(()=>createImageBitmap(file));
    const k=Math.min(1,3000/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
    c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    S.src=c;S.seed=Math.random()*99;S.lp=leakPos();setMode(false);drawPhoto();
  }catch(e){toast('Não consegui abrir essa imagem.')}
}
function save(){
  const out=document.createElement('canvas');S.hold=false;compose(out,3000,S.src.width,S.src.height,false,ONE);drawPhoto();
  const url=out.toDataURL('image/jpeg',.93);
  if(AND&&AND.saveImage){const ok=AND.saveImage(url.split(',')[1]);toast(ok?'Foto salva na galeria':'Não consegui salvar a foto')}
  else{const a=document.createElement('a');a.href=url;a.download='grao.jpg';a.click()}
  const tc=document.createElement('canvas');tc.width=120;tc.height=Math.round(120*out.height/out.width);tc.getContext('2d').drawImage(out,0,0,tc.width,tc.height);
  $('#bGal').style.backgroundImage=`url(${tc.toDataURL('image/jpeg',.7)})`;$('#bGal').firstElementChild.style.opacity=0;
}

// ---------- controles ----------
function leakPos(){const o=[[.95,.1],[.05,.9],[1,.5],[0,.3],[.9,.95],[.2,0]];return o[Math.random()*o.length|0]}
function flash(){const f=$('#flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
window.graoToast=toast;
const fmtEv=v=>(v>0?'+':'')+(Math.round(v*10)/10);
const fmtWb=()=>`${S.K}K ${S.tg>0?'+':''}${S.tg}`;
$('#roll').innerHTML=FILMS.map((F,i)=>`<button class="film" data-i="${i}"><span class="sw" style="background:linear-gradient(135deg,${F.sw[0]},${F.sw[1]} 55%,${F.sw[2]})"></span><b>${F.n}</b><small>${F.lens}mm</small></button>`).join('');
$('#recs').innerHTML=RECS.map((r,i)=>`<button class="rec" data-r="${i}"><b>${r[0]}</b><small>${r[1]} · ${r[5]}mm<br>${r[2]}K ${r[3]>0?'+':''}${r[3]} · ☀ ${fmtEv(r[4])}</small></button>`).join('');
$('#lenses').innerHTML=LENSES.map(l=>`<button class="chip" data-l="${l}">${l}mm</button>`).join('');
const FR=[['none','Nenhuma','linear-gradient(180deg,#9fd3e6,#3d97a8 55%,#d9b98a)'],['polaroid','Instantânea','linear-gradient(180deg,#9fd3e6,#3d97a8 55%,#d9b98a) 6px 6px/calc(100% - 12px) 34px no-repeat,#f3efe6'],['film','Negativo','linear-gradient(180deg,#9fd3e6,#3d97a8 55%,#d9b98a) 4px 10px/calc(100% - 8px) 34px no-repeat,#120d0a']];
$('#frames').innerHTML=FR.map(f=>`<button data-f="${f[0]}"><span style="background:${f[2]}"></span>${f[1]}</button>`).join('');
function store(){try{localStorage.setItem('grao.s2',JSON.stringify({f:S.f,K:S.K,tg:S.tg,ev:S.ev,lens:S.lens,mini:S.mini,date:S.date}))}catch(e){}}
function sync(){
  const F=FILMS[S.f];
  document.querySelectorAll('.film').forEach(b=>b.classList.toggle('sel',+b.dataset.i===S.f));
  document.querySelectorAll('.rec').forEach(b=>b.classList.toggle('sel',+b.dataset.r===S.rec));
  document.querySelectorAll('#lenses .chip').forEach(b=>b.classList.toggle('sel',+b.dataset.l===S.lens));
  document.querySelectorAll('#frames button').forEach(b=>b.classList.toggle('sel',b.dataset.f===S.frame));
  $('#bDate').classList.toggle('on',!!S.date);
  $('#tag').textContent=F.n.toUpperCase();$('#brand').textContent=F.n.toUpperCase();
  $('#sub').textContent=S.rec>=0?RECS[S.rec][0]:F.d;
  $('#cLens').textContent=S.lens;$('#oLens').textContent=S.lens+'mm';$('#lensmark').textContent=S.lens+'mm';
  $('#evv').textContent=fmtEv(S.ev);$('#oEv').textContent=fmtEv(S.ev);$('#ev').value=S.ev;
  $('#cWb').textContent=fmtWb();$('#oWb').textContent=fmtWb();
  const kn=$('#knob');kn.style.left=((S.K-2500)/8500*100)+'%';kn.style.top=((50-S.tg)/100*100)+'%';
  $('#finder').classList.toggle('mini',S.mini);$('#bMini').classList.toggle('on',S.mini);
  halfTag();store();
}
function pickFilm(i,keep){const F=FILMS[i];S.f=i;S.frame=F.frame;S.date=F.date;S.half1=null;
  if(!keep){S.K=F.K;S.tg=F.tg;S.lens=F.lens;S.ev=0;S.rec=-1}sync();redraw()}
function pickRec(i){const r=RECS[i];pickFilm(FI(r[1]),true);S.K=r[2];S.tg=r[3];S.ev=r[4];if(S.live)S.lens=r[5];S.rec=i;sync();redraw();toast(r[0])}
$('#roll').addEventListener('click',e=>{const b=e.target.closest('.film');if(b)pickFilm(+b.dataset.i)});
$('#recs').addEventListener('click',e=>{const b=e.target.closest('.rec');if(b)pickRec(+b.dataset.r)});
$('#lenses').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){S.lens=+b.dataset.l;S.rec=-1;sync()}});
$('#cLens').addEventListener('click',()=>{const i=LENSES.indexOf(S.lens);S.lens=LENSES[(i+1)%LENSES.length];S.rec=-1;sync()});
const openPop=()=>$('#pop').classList.add('on');
$('#cEv').addEventListener('click',openPop);$('#cWb').addEventListener('click',openPop);$('#cRec').addEventListener('click',openPop);
$('#bEdit').addEventListener('click',()=>$('#pop').classList.toggle('on'));
$('#ev').addEventListener('input',e=>{S.ev=+e.target.value;S.rec=-1;sync();redraw()});
// pad de balanço de branco: horizontal = temperatura, vertical = tint
const wbEl=$('#wb');let wbDrag=false;
function wbAt(e){const r=wbEl.getBoundingClientRect();
  const x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
  S.K=Math.round((2500+x*8500)/10)*10;S.tg=Math.round(50-y*100);S.rec=-1;sync();redraw()}
wbEl.addEventListener('pointerdown',e=>{wbDrag=true;wbEl.setPointerCapture(e.pointerId);wbAt(e)});
wbEl.addEventListener('pointermove',e=>{if(wbDrag)wbAt(e)});
wbEl.addEventListener('pointerup',()=>wbDrag=false);
$('#bAuto').addEventListener('click',()=>pickFilm(S.f));
$('#frames').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.frame=b.dataset.f;sync();redraw()}});
$('#bDate').addEventListener('click',()=>{S.date=S.date?0:1;sync();redraw()});
for(const id of ['amt','grn','lk']){const el=$('#'+id);el.addEventListener('input',()=>{S[id]=el.value/100;$('#o'+id).textContent=el.value;redraw()})}
$('#bMini').addEventListener('click',()=>{S.mini=!S.mini;sync();setTimeout(fit,260)});
$('#bBack').addEventListener('click',()=>setMode(true));
$('#bGal').addEventListener('click',()=>$('#pick').click());
$('#pick').addEventListener('change',e=>{loadFile(e.target.files[0]);e.target.value=''});
$('#bFlip').addEventListener('click',()=>{S.facing=S.facing==='user'?'environment':'user';startCam()});
$('#bTimer').addEventListener('click',()=>{S.timer=!S.timer;$('#bTimer').classList.toggle('on',S.timer);toast(S.timer?'Temporizador de 3 segundos ligado':'Temporizador desligado')});
$('#bTorch').addEventListener('click',async()=>{
  const tr=S.stream&&S.stream.getVideoTracks()[0];if(!tr)return;
  try{S.torch=!S.torch;await tr.applyConstraints({advanced:[{torch:S.torch}]});$('#bTorch').classList.toggle('on',S.torch)}catch(e){toast('Flash indisponível')}});
let counting=false;
$('#bShot').addEventListener('click',()=>{
  if(!S.live){save();return}
  if(counting)return;
  if(!S.timer){capture();return}
  counting=true;let n=3;const el=$('#count');el.classList.remove('hide');el.textContent=n;
  const iv=setInterval(()=>{n--;if(n===0){clearInterval(iv);el.classList.add('hide');counting=false;capture()}else el.textContent=n},1000);
});
view.addEventListener('pointerdown',()=>{if(!S.live){S.hold=true;redraw()}});
for(const ev of ['pointerup','pointerleave','pointercancel'])view.addEventListener(ev,()=>{if(S.hold){S.hold=false;redraw()}});
$('#finder').addEventListener('click',()=>$('#pop').classList.remove('on'));
$('#bUpd').addEventListener('click',()=>{if(AND&&AND.checkUpdate){AND.checkUpdate();toast('Procurando atualização…')}else toast('Disponível só no app instalado')});
$('#ver').textContent='Grão '+(AND&&AND.versionName?AND.versionName():'web');
addEventListener('resize',fit);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCam();else if(S.live)startCam()});

let saved=null;try{saved=JSON.parse(localStorage.getItem('grao.s2')||'null')}catch(e){}
if(saved&&FILMS[saved.f]){pickFilm(saved.f);Object.assign(S,{K:saved.K,tg:saved.tg,ev:saved.ev,lens:saved.lens,mini:!!saved.mini,date:saved.date});sync()}
else pickFilm(0);
setMode(true);
}
</script>
